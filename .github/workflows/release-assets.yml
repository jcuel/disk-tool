name: Release assets

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend and embed
        run: |
          cd web && npm ci && npm run build
          cd ..
          rm -rf cmd/disk-tool/static/*
          cp -r web/dist/* cmd/disk-tool/static/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o "disk-tool${{ matrix.ext }}" ./cmd/disk-tool

      - name: Smoke version
        if: matrix.goos == 'linux'
        run: |
          chmod +x disk-tool
          ./disk-tool version

      - name: Package artifact
        run: |
          mkdir -p dist
          name="disk-tool-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          cp "disk-tool${{ matrix.ext }}" "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: disk-tool-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  build-desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build web UI and embed
        run: |
          cd web && npm ci && npm run build
          rm -rf ../cmd/disk-tool/static/*
          cp -r dist/* ../cmd/disk-tool/static/

      - name: Build Go sidecar
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/disk-tool ./cmd/disk-tool
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            go build -ldflags="-s -w" -o bin/disk-tool.exe ./cmd/disk-tool
          else
            go build -ldflags="-s -w" -o bin/disk-tool ./cmd/disk-tool
          fi

      - name: Install sidecar for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-desktop-sidecar.sh bin/disk-tool

      - name: Install sidecar for Tauri (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          . ./build.ps1
          Install-DesktopSidecar

      - name: Install sidecar for Tauri (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-desktop-sidecar.sh bin/disk-tool

      - name: Generate desktop icons
        run: |
          cd desktop && npm ci
          npx tauri icon src-tauri/icons/icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "disk-tool ${{ github.ref_name }}"
          releaseBody: "Desktop installers and CLI binaries for ${{ github.ref_name }}."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  upload-release:
    name: Upload CLI to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: disk-tool-*
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
