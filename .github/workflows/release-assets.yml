name: Release assets

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend and embed
        run: |
          cd web && npm ci && npm run build
          cd ..
          rm -rf cmd/disk-tool/static/*
          cp -r web/dist/* cmd/disk-tool/static/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o "disk-tool${{ matrix.ext }}" ./cmd/disk-tool

      - name: Smoke version
        if: matrix.goos == 'linux'
        run: |
          chmod +x disk-tool
          ./disk-tool version

      - name: Package artifact
        run: |
          mkdir -p dist
          name="disk-tool-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          cp "disk-tool${{ matrix.ext }}" "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: disk-tool-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  build-desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: desktop-ubuntu-22.04
            tauri_args: ""
            bundle_glob: desktop/src-tauri/target/release/bundle/**/*
          - platform: windows-latest
            artifact: desktop-windows
            tauri_args: ""
            bundle_glob: desktop/src-tauri/target/release/bundle/**/*
          - platform: macos-latest
            artifact: desktop-macos-arm64
            tauri_args: "--target aarch64-apple-darwin"
            bundle_glob: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build web UI and embed
        run: |
          cd web && npm ci && npm run build
          rm -rf ../cmd/disk-tool/static/*
          cp -r dist/* ../cmd/disk-tool/static/

      - name: Build Go sidecar
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/disk-tool ./cmd/disk-tool
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            go build -ldflags="-s -w" -o bin/disk-tool.exe ./cmd/disk-tool
          else
            go build -ldflags="-s -w" -o bin/disk-tool ./cmd/disk-tool
          fi

      - name: Install sidecar for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-desktop-sidecar.sh bin/disk-tool

      - name: Install sidecar for Tauri (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          . ./build.ps1
          Install-DesktopSidecar

      - name: Install sidecar for Tauri (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-desktop-sidecar.sh bin/disk-tool

      - name: Generate desktop icons
        run: |
          cd desktop && npm ci
          npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri bundle
        run: |
          cd desktop
          npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Package desktop bundle
        shell: bash
        run: |
          mkdir -p dist/desktop
          shopt -s globstar nullglob
          for f in ${{ matrix.bundle_glob }}; do
            cp "$f" dist/desktop/
          done
          if [ ! "$(ls -A dist/desktop)" ]; then
            echo "No desktop bundle files matched: ${{ matrix.bundle_glob }}" >&2
            exit 1
          fi
          ls -la dist/desktop

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/desktop/*

  publish-release:
    name: Publish GitHub Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: disk-tool-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: disk-tool ${{ github.ref_name }}
          body: Desktop installers and CLI binaries for ${{ github.ref_name }}.
          draft: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
