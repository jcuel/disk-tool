name: Release assets

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend and embed
        run: |
          cd web && npm ci && npm run build
          cd ..
          rm -rf cmd/disk-tool/static/*
          cp -r web/dist/* cmd/disk-tool/static/

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w" -o "disk-tool${{ matrix.ext }}" ./cmd/disk-tool

      - name: Smoke version
        if: matrix.goos == 'linux'
        run: |
          chmod +x disk-tool
          ./disk-tool version

      - name: Package artifact
        run: |
          mkdir -p dist
          name="disk-tool-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          cp "disk-tool${{ matrix.ext }}" "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: disk-tool-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  build-desktop:
    name: Desktop ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: desktop-ubuntu-22.04
            tauri_args: ""
            bundle_glob: desktop/src-tauri/target/release/bundle/**/*
          - platform: windows-latest
            artifact: desktop-windows
            tauri_args: ""
            bundle_glob: desktop/src-tauri/target/release/bundle/**/*
          - platform: macos-latest
            artifact: desktop-macos-arm64
            tauri_args: "--target aarch64-apple-darwin"
            bundle_glob: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.13"
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build web UI and embed
        shell: bash
        run: |
          cd web && npm ci && npm run build
          rm -rf ../cmd/disk-tool/static/*
          cp -r dist/* ../cmd/disk-tool/static/

      - name: Build Go sidecar
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/disk-tool ./cmd/disk-tool
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            go build -ldflags="-s -w" -o bin/disk-tool.exe ./cmd/disk-tool
          else
            go build -ldflags="-s -w" -o bin/disk-tool ./cmd/disk-tool
          fi

      - name: Install sidecar for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/build-desktop-sidecar.sh bin/disk-tool

      - name: Install sidecar for Tauri (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          . ./build.ps1
          Install-DesktopSidecar

      - name: Install sidecar for Tauri (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-desktop-sidecar.sh bin/disk-tool

      - name: Generate desktop icons
        run: |
          cd desktop && npm ci
          npx tauri icon src-tauri/icons/icon.png

      - name: Build Tauri bundle
        run: |
          cd desktop
          npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Package desktop bundle
        shell: bash
        run: |
          platform=linux
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            platform=macos
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            platform=windows
          fi
          bash scripts/package-desktop-bundle.sh dist/desktop "$platform"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/desktop/*

  clamav-scan:
    name: Security — ClamAV release artifacts
    needs: [build, build-desktop]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: disk-tool-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Cache ClamAV database
        uses: actions/cache@v4
        with:
          path: /var/lib/clamav
          key: clamav-db-v1
          restore-keys: clamav-db-

      - name: Install ClamAV and update signatures
        run: bash scripts/clamav-install.sh

      - name: Scan release artifacts
        env:
          CLAMAV_REPORT: clamav-report.txt
        run: |
          bash scripts/collect-release-assets.sh artifacts release-scan
          bash scripts/clamav-scan.sh release-scan/

      - name: Upload ClamAV report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-report-release-${{ github.run_number }}
          path: clamav-report.txt
          if-no-files-found: ignore
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: [build, build-desktop, clamav-scan]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.clamav-scan.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: disk-tool-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: desktop-*
          merge-multiple: true

      - name: Collect release assets
        run: bash scripts/collect-release-assets.sh artifacts release

      - name: List release files
        run: find release -type f -exec ls -lh {} \;

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: disk-tool ${{ github.ref_name }}
          body: |
            Desktop installers (recommended) and CLI binaries.

            | Platform | Desktop (recommended) | CLI |
            |----------|----------------------|-----|
            | Windows | `*_x64-setup.exe` or `.msi` | `disk-tool-windows-amd64.exe` |
            | Linux | `.AppImage` or `.deb` | `disk-tool-linux-amd64` |
            | macOS | `.dmg` | `disk-tool-darwin-arm64` / `disk-tool-darwin-amd64` |

            **Windows:** do not double-click the CLI `.exe` expecting the desktop UI — use the NSIS/MSI installer.
          draft: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
